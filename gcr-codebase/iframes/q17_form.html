<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form and Iframe</title>
</head>
<body>
    <h1>Simple Form</h1>

    <form action="result.html" target="resultFrame">
        <label for="text">Enter Text:</label>
        <input type="text" id="text" name="text" required>
        <button type="submit">Submit</button>
    </form>

    <br>

    <!-- The result page is loaded into this iframe after the form is submitted. -->
    <iframe name="resultFrame" width="500" height="150" title="Result"></iframe>
</body>
</html>
