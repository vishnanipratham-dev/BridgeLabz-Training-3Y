<!DOCTYPE html>
<html>
<head>
    <title>Complete Webpage</title>
    <link rel="stylesheet" href="q10_webpage.css">
</head>
<body>
<header>
    <h1>My Website</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section id="home" class="hero">
    <h2>Welcome to My Website</h2>
</section>

<section id="about" class="about">
    <div>
        <h2>About Us</h2>
        <p>We create simple and useful web pages using HTML and CSS.</p>
    </div>
    <img src="https://picsum.photos/400/250" alt="About image">
</section>

<section id="services" class="services">
    <h2>Our Services</h2>
    <div class="service-box">
        <h3>Web Design</h3>
        <p>Simple website design.</p>
    </div>
    <div class="service-box">
        <h3>HTML</h3>
        <p>Clean page structure.</p>
    </div>
    <div class="service-box">
        <h3>CSS</h3>
        <p>Simple and responsive styling.</p>
    </div>
</section>

<section id="contact" class="contact">
    <h2>Contact</h2>
    <form>
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <textarea placeholder="Message"></textarea>
        <button type="submit">Send</button>
    </form>
</section>

<div class="fixed-help">Help</div>

<footer>
    <p>© 2026 Pratham Vishnani</p>
</footer>
</body>
</html>
