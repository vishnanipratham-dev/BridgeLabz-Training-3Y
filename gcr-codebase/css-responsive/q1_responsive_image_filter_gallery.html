<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="q1_responsive_image_filter_gallery.css">
</head>
<body>
    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main>
        <section class="gallery">
            <figure>
                <img class="blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Mountain landscape">
                <figcaption>Blur</figcaption>
            </figure>
            <figure>
                <img class="grayscale" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Lake landscape">
                <figcaption>Grayscale</figcaption>
            </figure>
            <figure>
                <img class="sepia" src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=600" alt="Forest">
                <figcaption>Sepia</figcaption>
            </figure>
            <figure>
                <img class="brightness" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600" alt="Nature">
                <figcaption>Brightness</figcaption>
            </figure>
            <figure>
                <img class="contrast" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Mountain and lake">
                <figcaption>Contrast</figcaption>
            </figure>
            <figure>
                <img class="hue" src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=600" alt="Green hills">
                <figcaption>Hue Rotate</figcaption>
            </figure>
        </section>
    </main>

    <footer>Responsive CSS Assignment - Q1</footer>
</body>
</html>
