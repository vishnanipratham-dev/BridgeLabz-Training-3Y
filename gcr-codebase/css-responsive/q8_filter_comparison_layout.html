<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="q8_filter_comparison_layout.css">
</head>
<body>
    <main>
        <h1>Before and After Filter</h1>

        <section class="comparison">
            <figure>
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700" alt="Original landscape">
                <figcaption>Before - Original</figcaption>
            </figure>

            <figure>
                <img class="filtered" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700" alt="Filtered landscape">
                <figcaption>After - Brightness Filter</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
