<!DOCTYPE html>
<html>
<head>
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="q01_pseudoclasses.css">
</head>
<body>
<header><h1>Pseudo Classes</h1></header>
<main>
    <div class="example"><a href="#">Hover Link</a><p>:hover changes style when the mouse is over an element.</p></div>
    <div class="example"><button>Click Me</button><p>:active works while a button is being clicked.</p></div>
    <div class="example"><input type="text" placeholder="Focus Me"><p>:focus works when an input is selected.</p></div>
    <div class="example"><ul><li>First</li><li>Second</li><li>Third</li></ul><p>:nth-child() selects an item by its position.</p></div>
</main>
<footer><p>CSS Practice</p></footer>
</body>
</html>
