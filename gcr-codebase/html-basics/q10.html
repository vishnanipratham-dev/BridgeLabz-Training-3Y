<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

    <h1>Select Your Travel Preferences</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>

    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>Japan</option>
    </select>

    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>

    <select id="state">
        <option selected>Rajasthan</option>
        <option>Uttar Pradesh</option>
        <option>Maharashtra</option>
    </select>

    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>

    <select id="city">
        <option selected>Jaipur</option>
        <option>Agra</option>
        <option>Mumbai</option>
    </select>

    <br><br>

    <!-- Tourist place selection -->
    <label for="place">Favorite Tourist Place:</label>

    <select id="place">
        <option selected>Hawa Mahal</option>
        <option>Taj Mahal</option>
        <option>Gateway of India</option>
    </select>

    <!-- Summary of selections -->
    <p>
        My selected country is India, my state is Rajasthan,
        my city is Jaipur, and my favorite tourist place is Hawa Mahal.
    </p>

</body>
</html>
