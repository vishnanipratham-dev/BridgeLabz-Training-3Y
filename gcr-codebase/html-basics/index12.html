<!DOCTYPE html>
<html>
<head>
    <title>Inline Formatting</title>
</head>
<body>

    <!-- Combining different inline HTML elements -->
    <p>
        <strong>Learning HTML</strong> is an
        <em>interesting experience</em>.<br>

        I am currently learning <mark>HTML Basics</mark>.<br>

        <small>I practice regularly to improve my skills.</small>
    </p>

</body>
</html>
