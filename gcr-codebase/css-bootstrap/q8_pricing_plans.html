<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q8_pricing_plans.css">
</head>
<body>
<main class="container py-5">
    <header class="text-center mb-4">
        <h1>Choose Your Plan</h1>
        <p>Simple plans for every user.</p>
    </header>

    <div class="row g-4">
        <div class="col-12 col-md-4">
            <div class="card plan h-100 p-3 shadow-sm">
                <h2>Basic</h2><h3>₹199/month</h3>
                <ul><li>5 Projects</li><li>1 User</li><li>Email Support</li></ul>
                <button class="btn btn-outline-primary">Choose</button>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card plan h-100 p-3 bg-primary text-white shadow-sm">
                <h2>Pro</h2><h3>₹499/month</h3>
                <ul><li>20 Projects</li><li>5 Users</li><li>Priority Support</li></ul>
                <button class="btn btn-light">Choose</button>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card plan h-100 p-3 shadow-sm">
                <h2>Premium</h2><h3>₹999/month</h3>
                <ul><li>Unlimited Projects</li><li>10 Users</li><li>24/7 Support</li></ul>
                <button class="btn btn-outline-primary">Choose</button>
            </div>
        </div>
    </div>
</main>
</body>
</html>
