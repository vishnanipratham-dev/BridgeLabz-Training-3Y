<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q6_notifications_dashboard.css">
</head>
<body>
<main class="container py-5">
    <div class="card p-4">
        <h1 class="text-center">Notifications</h1>

        <div class="alert alert-success">You received a new message.</div>
        <div class="alert alert-info">Tip: Complete your profile.</div>
        <div class="alert alert-danger">Your password will expire soon.</div>

        <div class="alert alert-warning alert-dismissible fade show">
            This is a dismissible notification.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <section class="bg-light border p-4">
            <h2>Summary</h2>
            <p>You have 3 new notifications today.</p>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
