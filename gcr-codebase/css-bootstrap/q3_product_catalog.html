<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q3_product_catalog.css">
</head>
<body>
<header class="container text-center py-4">
    <h1>Simple Store</h1>
    <p>Our Products</p>
</header>

<main class="container">
    <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product">
                <img src="https://picsum.photos/300/200?1" class="card-img-top" alt="Product">
                <div class="card-body text-center">
                    <h5>Watch</h5><p>₹999</p><button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product">
                <img src="https://picsum.photos/300/200?2" class="card-img-top" alt="Product">
                <div class="card-body text-center">
                    <h5>Headphones</h5><p>₹1499</p><button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product">
                <img src="https://picsum.photos/300/200?3" class="card-img-top" alt="Product">
                <div class="card-body text-center">
                    <h5>Backpack</h5><p>₹799</p><button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product">
                <img src="https://picsum.photos/300/200?4" class="card-img-top" alt="Product">
                <div class="card-body text-center">
                    <h5>Shoes</h5><p>₹1999</p><button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
