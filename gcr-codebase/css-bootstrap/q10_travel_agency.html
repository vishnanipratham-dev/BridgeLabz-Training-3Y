<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q10_travel_agency.css">
</head>
<body>
<header class="container text-center py-4">
    <h1>Explore the World</h1>
    <p>Find your next beautiful destination.</p>
</header>

<main class="container">
    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="3000">
                <img src="https://picsum.photos/900/400?11" class="d-block w-100" alt="Mountains">
                <div class="carousel-caption">
                    <h2>Mountains</h2>
                    <p>Enjoy peaceful mountain views.</p>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="3000">
                <img src="https://picsum.photos/900/400?12" class="d-block w-100" alt="Beach">
                <div class="carousel-caption">
                    <h2>Beach</h2>
                    <p>Relax beside the sea.</p>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="3000">
                <img src="https://picsum.photos/900/400?13" class="d-block w-100" alt="City">
                <div class="carousel-caption">
                    <h2>City</h2>
                    <p>Explore new cities and cultures.</p>
                </div>
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <section class="mt-5">
        <h2>Booking Progress</h2>
        <div class="progress">
            <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 70%;">
                70%
            </div>
        </div>
    </section>
</main>

<footer class="text-center bg-light mt-5 p-4">
    <p>Contact: travel@example.com | +91 98765 43210</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
