<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q7_task_tracker.css">
</head>
<body>
<main class="container py-5">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1>Task Tracker</h1>
        <span class="badge bg-danger">3 Pending</span>
    </header>

    <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between">
            Complete Java <span class="badge bg-danger">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between">
            Practice DSA <span class="badge bg-warning text-dark">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between">
            Read Bootstrap <span class="badge bg-success">Low</span>
        </li>
    </ul>

    <button class="btn btn-primary mt-4">
        Completed <span class="badge bg-light text-dark">2</span>
    </button>
</main>
</body>
</html>
