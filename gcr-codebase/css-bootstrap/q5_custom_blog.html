<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="q5_custom_blog.css">
</head>
<body>
<header class="container text-center py-4">
    <h1>My Tech Blog</h1>
    <p>Simple notes about coding and technology.</p>
</header>

<main class="container">
    <div class="row g-4">
        <article class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="card-title">Learning Java</h2>
                    <p class="card-text">Java is useful for learning programming, DSA and backend development.</p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </div>
        </article>
        <article class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="card-title">Why Learn Bootstrap?</h2>
                    <p class="card-text">Bootstrap helps us create responsive websites with ready-made classes.</p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </div>
        </article>
    </div>
</main>

<footer class="text-center mt-5 p-3">
    <p>© 2026 My Tech Blog</p>
</footer>
</body>
</html>
