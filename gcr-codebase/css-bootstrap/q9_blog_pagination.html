<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Pagination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q9_blog_pagination.css">
</head>
<body>
<main class="container py-5">
    <h1 class="text-center">My Blog Posts</h1>
    <p class="text-center">Browse through different pages of posts.</p>

    <nav class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item"><a class="page-link" href="#">Previous</a></li>
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul>
    </nav>

    <div class="text-center mt-4">
        <button class="btn btn-outline-secondary me-2">Older Posts</button>
        <button class="btn btn-outline-secondary">Newer Posts</button>
    </div>
</main>
</body>
</html>
