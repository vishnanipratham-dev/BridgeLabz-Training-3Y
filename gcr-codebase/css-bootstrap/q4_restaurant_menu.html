<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q4_restaurant_menu.css">
</head>
<body>
<main class="container py-4">
    <header class="text-center">
        <h1>Today's Menu</h1>
        <p class="lead">Fresh food made with care</p>
    </header>

    <section class="mt-4">
        <table class="table table-bordered">
            <thead class="table-dark">
                <tr><th>Item</th><th>Category</th><th>Price</th></tr>
            </thead>
            <tbody>
                <tr><td>Paneer Tikka</td><td>Starter</td><td>₹180</td></tr>
                <tr><td>Veg Biryani</td><td>Main Course</td><td>₹220</td></tr>
                <tr><td>Gulab Jamun</td><td>Dessert</td><td>₹90</td></tr>
            </tbody>
        </table>
    </section>

    <section class="mt-4">
        <h2>Chef's Specials</h2>
        <ul class="list-group">
            <li class="list-group-item">Special Paneer Curry</li>
            <li class="list-group-item">Cheese Garlic Bread</li>
            <li class="list-group-item">Chocolate Brownie</li>
        </ul>
    </section>

    <figure class="text-center mt-4">
        <img src="https://picsum.photos/700/300?food" class="img-fluid" alt="Food">
        <figcaption>Fresh food served every day</figcaption>
    </figure>
</main>
</body>
</html>
